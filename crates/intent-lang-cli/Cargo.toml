[package]
name = "intent-lang-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI for intent-lang: parse, verify, diff, and analyze .intent files"
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "intent"
path = "src/main.rs"

[dependencies]
intent-lang-syntax.workspace = true
intent-lang-core.workspace = true
intent-lang-accept.workspace = true
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
