name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: intent-linux-x86_64
            ext: ''
            install_deps: sudo apt-get update && sudo apt-get install -y cmake build-essential
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: intent-macos-aarch64
            ext: ''
            install_deps: brew install cmake
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: intent-macos-x86_64
            ext: ''
            install_deps: brew install cmake
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: intent-windows-x86_64
            ext: '.exe'
            install_deps: echo "cmake preinstalled on windows-latest"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        run: ${{ matrix.install_deps }}

      - name: Build
        run: cargo build --release -p intent-lang-cli --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          BIN="${{ matrix.artifact }}${{ matrix.ext }}"
          SRC="target/${{ matrix.target }}/release/intent${{ matrix.ext }}"
          cp "$SRC" "$BIN"
          chmod +x "$BIN" 2>/dev/null || true
          if command -v sha256sum >/dev/null; then
            sha256sum "$BIN" > "${BIN}.sha256"
          else
            shasum -a 256 "$BIN" > "${BIN}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}${{ matrix.ext }}
            ${{ matrix.artifact }}${{ matrix.ext }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: find dist -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/intent-*
