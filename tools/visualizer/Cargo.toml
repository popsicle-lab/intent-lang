[package]
name = "intent-lang-visualizer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Render intent-lang programs as Mermaid, Graphviz DOT, and JSON graphs"
readme = "README.md"
keywords = ["intent", "mermaid", "visualization", "requirements", "graph"]
categories = ["development-tools", "visualization"]

[lib]
name = "intent_lang_visualizer"
path = "src/lib.rs"

[[bin]]
name = "intent-lang-visualizer"
path = "src/main.rs"

[dependencies]
intent-lang-syntax.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
logos = "0.14"

[dev-dependencies]
insta = "1.34"
